services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arsitex-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/storage/arsitex.db
      - STORAGE_DIR=/app/storage
      - PYTHONUNBUFFERED=1
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arsitex-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

